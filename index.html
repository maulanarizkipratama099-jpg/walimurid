<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantau Absensi | Wali Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Inter', sans-serif; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out;
    }
    
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 16px 24px;
      border-radius: 12px;
      color: white;
      z-index: 9999;
      animation: fadeIn 0.3s ease-out;
      max-width: 400px;
    }
    
    .toast-success { background: #10b981; }
    .toast-error { background: #ef4444; }
    .toast-info { background: #3b82f6; }
    
    .status-badge {
      padding: 4px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
    }
    
    .status-hadir { background: #d1fae5; color: #059669; }
    .status-izin { background: #fef3c7; color: #b45309; }
    .status-sakit { background: #fee2e2; color: #dc2626; }
    .status-absen { background: #f3f4f6; color: #6b7280; }
    
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Style untuk foto siswa */
    .student-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .student-avatar-small {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e5e7eb;
    }

    .photo-placeholder {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
      border: 3px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen font-sans antialiased">
  <!-- Login Screen -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white/95 backdrop-blur-lg rounded-3xl shadow-2xl p-8 animate-fadeIn">
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-xl">
          <i class="fas fa-user-graduate text-white text-3xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Portal Wali Murid</h1>
        <p class="text-gray-500">MAS IBNU HUSAIN</p>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">NIS Anak</label>
          <input type="text" id="loginNis" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Masukkan NIS">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" id="loginPassword" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Masukkan password">
        </div>
        <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3 rounded-xl font-semibold hover:from-blue-700 hover:to-indigo-700 transition shadow-lg">
          <i class="fas fa-sign-in-alt mr-2"></i> Lihat Absensi
        </button>
      </div>
      
      <div class="mt-6 p-4 bg-blue-50 rounded-xl border border-blue-100">
        <p class="text-xs text-blue-700 text-center">
          <i class="fas fa-info-circle mr-1"></i>
          Hubungi sekolah untuk mendapatkan password. Demo: NIS 2024001, password 12345678
        </p>
      </div>
    </div>
  </div>

  <!-- Dashboard Screen -->
  <div id="dashboardScreen" class="hidden p-4">
    <div class="max-w-4xl mx-auto">
      <!-- Header dengan Foto -->
      <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-6 mb-6 text-white shadow-xl">
        <div class="flex items-center gap-4">
          <!-- Foto Siswa -->
          <div id="studentPhotoContainer" class="relative">
            <img id="studentPhoto" src="" alt="Foto Siswa" class="student-avatar hidden">
            <div id="photoPlaceholder" class="photo-placeholder">
              <span id="initialName"></span>
            </div>
          </div>
          
          <div class="flex-1">
            <h2 id="studentName" class="text-2xl font-bold"></h2>
            <p id="studentClass" class="text-white/80 text-sm"></p>
            <p id="studentNis" class="text-white/60 text-xs mt-1"></p>
          </div>
          <button onclick="logout()" class="px-4 py-2 bg-white/20 hover:bg-white/30 rounded-xl transition text-sm flex items-center gap-2">
            <i class="fas fa-sign-out-alt"></i>
            <span>Keluar</span>
          </button>
        </div>
      </div>

      <!-- Stats Cards -->
      <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="bg-white rounded-xl p-4 text-center shadow-sm hover:shadow-md transition">
          <div class="text-2xl font-bold text-green-600" id="statHadir">0</div>
          <div class="text-xs text-gray-500 mt-1">Hadir</div>
        </div>
        <div class="bg-white rounded-xl p-4 text-center shadow-sm hover:shadow-md transition">
          <div class="text-2xl font-bold text-yellow-600" id="statIzin">0</div>
          <div class="text-xs text-gray-500 mt-1">Izin</div>
        </div>
        <div class="bg-white rounded-xl p-4 text-center shadow-sm hover:shadow-md transition">
          <div class="text-2xl font-bold text-red-600" id="statSakit">0</div>
          <div class="text-xs text-gray-500 mt-1">Sakit</div>
        </div>
      </div>

      <!-- Persentase Card -->
      <div class="bg-white rounded-xl p-6 mb-6 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-gray-800">Tingkat Kehadiran</h3>
          <span class="text-2xl font-bold text-blue-600" id="persentase">0%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-3">
          <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-indigo-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <!-- Filter -->
      <div class="bg-white rounded-xl p-4 mb-4 shadow-sm">
        <div class="flex flex-wrap gap-2">
          <select id="monthFilter" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
            <option value="">Semua Bulan</option>
            <option value="01">Januari</option>
            <option value="02">Februari</option>
            <option value="03">Maret</option>
            <option value="04">April</option>
            <option value="05">Mei</option>
            <option value="06">Juni</option>
            <option value="07">Juli</option>
            <option value="08">Agustus</option>
            <option value="09">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Desember</option>
          </select>
          <select id="yearFilter" class="w-28 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
          </select>
          <button onclick="loadAttendance()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 transition flex items-center gap-1">
            <i class="fas fa-search"></i>
            <span class="hidden sm:inline">Filter</span>
          </button>
        </div>
      </div>

      <!-- Attendance List -->
      <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="p-4 border-b border-gray-100 bg-gradient-to-r from-gray-50 to-white">
          <h3 class="font-semibold text-gray-800 flex items-center gap-2">
            <i class="fas fa-history text-blue-600"></i>
            Riwayat Absensi
          </h3>
        </div>
        <div id="attendanceList" class="p-4 max-h-96 overflow-y-auto custom-scrollbar space-y-2">
          <!-- akan diisi oleh JavaScript -->
        </div>
      </div>

      <!-- Footer -->
      <div class="mt-4 text-center text-xs text-gray-500">
        <p>Data diperbarui secara real-time. Terakhir: <span id="lastUpdate">-</span></p>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <script>
    const JSONBIN_CONFIG = {
        API_KEY: "$2a$10$uIB7UH1hUV6kFv7v4l21puJBjd.1.r9SYqT8XT94RkJyHCyzGQQFm",
        BINS: {
            STUDENTS: "699ffd15ae596e708f4b42a4",
            ATTENDANCE: "699ffd3c43b1c97be99f754c"
        },
        BASE_URL: "https://api.jsonbin.io/v3/b"
    };

    let students = [];
    let attendanceRecords = [];
    let currentStudent = null;
    let refreshInterval = null;

    async function loadData() {
        try {
            const [studentsRes, attendanceRes] = await Promise.all([
                fetch(`${JSONBIN_CONFIG.BASE_URL}/${JSONBIN_CONFIG.BINS.STUDENTS}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_CONFIG.API_KEY, 'X-Bin-Meta': 'false' }
                }),
                fetch(`${JSONBIN_CONFIG.BASE_URL}/${JSONBIN_CONFIG.BINS.ATTENDANCE}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_CONFIG.API_KEY, 'X-Bin-Meta': 'false' }
                })
            ]);

            students = await studentsRes.json();
            attendanceRecords = await attendanceRes.json();

            if (!Array.isArray(students)) students = [];
            if (!Array.isArray(attendanceRecords)) attendanceRecords = [];

            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('id-ID');
            
            if (currentStudent) {
                // ✅ Update data student jika ada perubahan dari admin
                const updatedStudent = students.find(s => s.id === currentStudent.id);
                if (updatedStudent) {
                    currentStudent = updatedStudent;
                    updateStudentDisplay();
                }
                loadAttendance();
            }
        } catch (error) {
            console.error('Error loading data:', error);
            showToast('Gagal memuat data', 'error');
        }
    }

    function startAutoRefresh() {
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(loadData, 30000); // Refresh setiap 30 detik
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast toast-${type} flex items-center gap-3`;
        toast.innerHTML = `
            <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} text-lg"></i>
            <span>${message}</span>
        `;
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.remove();
        }, 3000);
    }

    function formatDate(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        return date.toLocaleDateString('id-ID', { 
            weekday: 'long', 
            day: 'numeric', 
            month: 'long', 
            year: 'numeric' 
        });
    }

    function formatTime(timestamp) {
        if (!timestamp) return '-';
        return new Date(timestamp).toLocaleTimeString('id-ID', {
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    // ✅ FUNGSI UPDATE TAMPILAN SISWA (TERMASUK FOTO)
    function updateStudentDisplay() {
        if (!currentStudent) return;
        
        document.getElementById('studentName').textContent = currentStudent.nama;
        document.getElementById('studentClass').textContent = `${currentStudent.kelas} - ${currentStudent.jurusan}`;
        document.getElementById('studentNis').textContent = `NIS: ${currentStudent.nis}`;
        
        // ✅ TAMPILKAN FOTO JIKA ADA
        const studentPhoto = document.getElementById('studentPhoto');
        const photoPlaceholder = document.getElementById('photoPlaceholder');
        const initialName = document.getElementById('initialName');
        
        if (currentStudent.photo) {
            // Tampilkan foto
            studentPhoto.src = currentStudent.photo;
            studentPhoto.classList.remove('hidden');
            photoPlaceholder.classList.add('hidden');
        } else {
            // Tampilkan placeholder dengan inisial
            studentPhoto.classList.add('hidden');
            photoPlaceholder.classList.remove('hidden');
            
            // Ambil huruf pertama dari nama
            const initial = currentStudent.nama ? currentStudent.nama.charAt(0).toUpperCase() : '?';
            initialName.textContent = initial;
        }
    }

    async function handleLogin() {
        const nis = document.getElementById('loginNis').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (password !== "12345678") {
            showToast('Password salah!', 'error');
            return;
        }

        await loadData();

        const student = students.find(s => s.nis === nis);
        if (!student) {
            showToast('NIS tidak ditemukan!', 'error');
            return;
        }

        currentStudent = student;
        
        // ✅ TAMPILKAN DATA SISWA + FOTO
        updateStudentDisplay();

        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');

        loadAttendance();
        startAutoRefresh();
        showToast(`Selamat datang, ${student.nama}`, 'success');
    }

    function loadAttendance() {
        if (!currentStudent) return;
        
        const month = document.getElementById('monthFilter').value;
        const year = document.getElementById('yearFilter').value;
        
        let filtered = attendanceRecords.filter(r => r.student_id === currentStudent.id);
        
        if (month) {
            filtered = filtered.filter(r => r.tanggal.split('-')[1] === month);
        }
        
        if (year) {
            filtered = filtered.filter(r => r.tanggal.split('-')[0] === year);
        }

        filtered.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

        const stats = {
            hadir: filtered.filter(r => r.status === 'hadir').length,
            izin: filtered.filter(r => r.status === 'izin').length,
            sakit: filtered.filter(r => r.status === 'sakit').length,
            absen: filtered.filter(r => r.status === 'absen').length
        };

        const total = filtered.length;
        const persentase = total > 0 ? ((stats.hadir / total) * 100).toFixed(1) : 0;

        document.getElementById('statHadir').textContent = stats.hadir;
        document.getElementById('statIzin').textContent = stats.izin;
        document.getElementById('statSakit').textContent = stats.sakit;
        document.getElementById('persentase').textContent = `${persentase}%`;
        document.getElementById('progressBar').style.width = `${persentase}%`;

        const list = document.getElementById('attendanceList');
        
        if (filtered.length === 0) {
            list.innerHTML = `
                <div class="text-center py-12">
                    <div class="text-5xl mb-4 text-gray-300">📅</div>
                    <p class="text-gray-500">Belum ada data absensi</p>
                </div>
            `;
            return;
        }

        // ✅ TAMPILKAN FOTO JUGA DI SETIAP ITEM RIWAYAT
        list.innerHTML = filtered.map(r => {
            const date = new Date(r.tanggal);
            const dayName = date.toLocaleDateString('id-ID', { weekday: 'long' });
            const formattedDate = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            
            const statusColors = {
                hadir: 'status-hadir',
                izin: 'status-izin',
                sakit: 'status-sakit',
                absen: 'status-absen'
            };

            const metodeIcon = {
                qr: 'fa-qrcode',
                manual: 'fa-pen'
            };

            // Foto dari record attendance (sudah disalin dari data siswa saat scan)
            const photoHtml = r.student_photo ? 
                `<img src="${r.student_photo}" class="student-avatar-small">` : 
                `<div class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center text-white font-bold text-sm">${r.student_nama ? r.student_nama.charAt(0).toUpperCase() : '?'}</div>`;

            return `
                <div class="flex items-center gap-3 p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition">
                    ${photoHtml}
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-sm font-medium text-gray-800">${dayName}, ${formattedDate}</span>
                            <span class="text-xs text-gray-500">
                                <i class="fas fa-clock mr-1"></i>${formatTime(r.timestamp)}
                            </span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="status-badge ${statusColors[r.status]}">
                                ${r.status.toUpperCase()}
                            </span>
                            <span class="text-xs text-gray-500">
                                <i class="fas ${metodeIcon[r.metode] || 'fa-question'} mr-1"></i>
                                ${r.metode || 'manual'}
                            </span>
                        </div>
                        ${r.keterangan ? `<p class="text-xs text-gray-500 mt-1">📝 ${r.keterangan}</p>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    function logout() {
        if (refreshInterval) {
            clearInterval(refreshInterval);
            refreshInterval = null;
        }
        currentStudent = null;
        document.getElementById('dashboardScreen').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('loginNis').value = '';
        document.getElementById('loginPassword').value = '';
        
        // Reset foto
        document.getElementById('studentPhoto').classList.add('hidden');
        document.getElementById('photoPlaceholder').classList.remove('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date();
        document.getElementById('yearFilter').value = today.getFullYear().toString();
    });
  </script>
</body>
</html>
