    // ==================== FUNGSI API GOOGLE APPS SCRIPT ====================
    async function fetchSheetData(sheetName) {
        return new Promise((resolve) => {
            const callbackName = `jsonp_${Date.now()}_${Math.random().toString(36).substr(2, 8)}`;
            
            window[callbackName] = function(response) {
                console.log(`📥 Response diterima untuk ${sheetName}:`, response);
                
                const script = document.getElementById(callbackName);
                if (script) script.remove();
                
                delete window[callbackName];
                clearTimeout(timeout);
                
                if (response && response.success) {
                    resolve(response.data || []);
                } else {
                    resolve([]);
                }
            };

            const timeout = setTimeout(() => {
                console.log(`⏱️ Timeout fetch ${sheetName}`);
                if (window[callbackName]) {
                    delete window[callbackName];
                }
                const script = document.getElementById(callbackName);
                if (script) script.remove();
                resolve([]);
            }, 10000);

            const actionMap = {
                'STUDENTS': 'getStudents',
                'ATTENDANCE': 'getAttendance',
                'PELANGGARAN': 'getPelanggaran',
                'NOTES': 'getNotes',
                'CONFIG': 'getConfig'
            };

            const action = actionMap[sheetName];
            if (!action) {
                clearTimeout(timeout);
                delete window[callbackName];
                resolve([]);
                return;
            }

            const script = document.createElement('script');
            script.id = callbackName;
            script.src = `${APPS_SCRIPT_URL}?action=${action}&callback=${callbackName}&_=${Date.now()}`;
            
            script.onerror = () => {
                console.error(`❌ Script error fetch ${sheetName}`);
                clearTimeout(timeout);
                if (window[callbackName]) {
                    delete window[callbackName];
                }
                script.remove();
                resolve([]);
            };

            document.body.appendChild(script);
            console.log(`📤 Mengirim request ${sheetName} dengan callback ${callbackName}`);
        });
    }

    // ==================== FUNGSI GOOGLE SHEETS UNTUK HAFALAN ====================
    async function fetchHafalanData(sheetId, sheetName, range) {
        try {
            // Gunakan API Key untuk akses read-only
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${sheetName}!${range}?key=${GOOGLE_API_KEY}`;
            
            console.log(`📥 Fetching hafalan: ${sheetId} - ${sheetName}`);
            
            const response = await fetch(url);
            
            if (!response.ok) {
                console.error(`HTTP error: ${response.status}`);
                return [];
            }
            
            const data = await response.json();
            return data.values || [];
            
        } catch (error) {
            console.error(`Error fetching hafalan:`, error);
            return [];
        }
    }

    async function getSurahNames(sheetId, sheetName) {
        try {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${sheetName}!A5:AQ5?key=${GOOGLE_API_KEY}`;
            const response = await fetch(url);
            
            if (!response.ok) return [];
            
            const data = await response.json();
            const row = data.values?.[0] || [];
            
            // Ambil dari kolom G sampai seterusnya (index 6)
            return row.slice(6, 6 + 37);
            
        } catch (error) {
            console.error('Error fetching surah names:', error);
            return [];
        }
    }

    function getSheetNameByClass(kelas) {
        if (!kelas) return SHEET_NAMES_HAFALAN.X;
        
        const kelasUpper = kelas.toUpperCase().trim();
        
        if (kelasUpper.startsWith('XII')) return SHEET_NAMES_HAFALAN.XII;
        if (kelasUpper.startsWith('XI')) return SHEET_NAMES_HAFALAN.XI;
        if (kelasUpper.startsWith('X')) return SHEET_NAMES_HAFALAN.X;
        
        return SHEET_NAMES_HAFALAN.X;
    }

    function processQuranData(row) {
        if (!row) return;
        
        const totalHafal = parseInt(row[COLUMN_INDEX.QURAN.TOTAL_HAFALAN]) || 0;
        
        const hafal = [];
        const belum = [];
        
        for (let i = 1; i <= TARGETS.QURAN; i++) {
            const colIndex = COLUMN_INDEX.QURAN.START_SURAH + (i - 1);
            const status = row[colIndex]?.toString().toLowerCase() || '';
            const isHafal = status === '☑' || status === 'true' || status === '1' || status === 'yes' || status === '✓';
            
            if (isHafal) {
                hafal.push(i);
            } else {
                belum.push(i);
            }
        }
        
        const progress = (totalHafal / TARGETS.QURAN) * 100;
        const lastSurahNum = hafal.length > 0 ? Math.max(...hafal) : 0;
        const lastSurahName = (lastSurahNum > 0 && surahNames[lastSurahNum - 1]) 
            ? `${lastSurahNum}. ${surahNames[lastSurahNum - 1]}`
            : '-';
        
        // Update UI
        document.getElementById('quranLastSurah').textContent = lastSurahName;
        document.getElementById('quranTotalHafal').textContent = `${totalHafal} Surat`;
        document.getElementById('quranProgressPercent').textContent = `${progress.toFixed(1)}%`;
        document.getElementById('quranProgressBar').style.width = `${progress}%`;
        document.getElementById('quranStats').textContent = `${totalHafal}/${TARGETS.QURAN} Surat`;
        document.getElementById('quranHafalCount').textContent = hafal.length;
        document.getElementById('quranBelumCount').textContent = belum.length;
        
        // Render daftar surat yang sudah hafal
        const hafalList = document.getElementById('quranHafalList');
        hafalList.innerHTML = hafal.map(num => `
            <div class="surah-item hafal">
                <div class="surah-number hafal">${num}</div>
                <span class="surah-name">${surahNames[num - 1] || `Surat ${num}`}</span>
                <i class="fas fa-check-circle text-[#d4af37] text-xs ml-2"></i>
            </div>
        `).join('');
        
        // Render daftar surat yang belum hafal
        const belumList = document.getElementById('quranBelumList');
        if (belum.length > 0) {
            belumList.innerHTML = belum.map(num => `
                <div class="surah-item belum">
                    <div class="surah-number belum">${num}</div>
                    <span class="surah-name">${surahNames[num - 1] || `Surat ${num}`}</span>
                    <i class="fas fa-hourglass-half text-red-400 text-xs ml-2"></i>
                </div>
            `).join('');
        } else {
            belumList.innerHTML = '<div class="text-xs text-green-600 p-3 text-center">✅ Semua surat sudah hafal!</div>';
        }
    }

    // ==================== FUNGSI GOOGLE DRIVE UNTUK FOTO ====================
    function extractGoogleDriveFileId(url) {
        if (!url) return null;
        
        const patterns = [
            /\/file\/d\/([^\/?#]+)/,
            /\/open\?id=([^&?#]+)/,
            /\/uc\?id=([^&?#]+)/,
            /\/d\/([^\/?#]+)/,
            /id=([^&?#]+)/
        ];
        
        for (let pattern of patterns) {
            const match = url.match(pattern);
            if (match && match[1]) {
                return match[1];
            }
        }
        
        return null;
    }

    function convertGoogleDriveLink(link) {
        if (!link) return '';
        
        const fileId = extractGoogleDriveFileId(link);
        if (!fileId) return link;
        
        return `https://drive.google.com/thumbnail?id=${fileId}&sz=w400-h400`;
    }

    function handleImageError(imgElement) {

        document.getElementById('studentPhotoFallback').classList.remove('hidden');

    async function loadStudentPhoto(photoUrl) {
        const photoEl = document.getElementById('studentPhoto');
        const fallbackEl = document.getElementById('studentPhotoFallback');
        const loadingEl = document.getElementById('studentPhotoLoading');
        
        if (!photoUrl) {
            photoEl.classList.add('hidden');
            fallbackEl.classList.remove('hidden');
            loadingEl.classList.add('hidden');
            return;
        }
        
        loadingEl.classList.remove('hidden');
        fallbackEl.classList.add('hidden');
        
        const imageUrl = convertGoogleDriveLink(photoUrl);
        
        const img = new Image();
        img.onload = () => {
            photoEl.src = imageUrl;
            photoEl.classList.remove('hidden');
            fallbackEl.classList.add('hidden');
            loadingEl.classList.add('hidden');
        };
        
        img.onerror = () => {
            console.error('Gagal memuat gambar:', photoUrl);
            photoEl.classList.add('hidden');
            fallbackEl.classList.remove('hidden');
            loadingEl.classList.add('hidden');
            showToast('Gagal memuat foto siswa', 'error');
        };
        
        img.src = imageUrl;
    }

    async function initSplashScreen() {
        return new Promise(async (resolve) => {
            const splash = document.getElementById('splashScreen');
            const progressBar = document.getElementById('splashProgressBar');
            const statusText = document.getElementById('splashStatus');
            
            try {

                    configData = config;
                    
                    if (configData.school_logo) {
                        document.getElementById('splashLogo').src = configData.school_logo;
                        document.getElementById('splashLogo').classList.remove('hidden');
                        document.getElementById('splashLogoDefault').classList.add('hidden');
                    }
                }
                
                const steps = [
                    { progress: 20, text: 'Menyiapkan portal...' },
                    { progress: 40, text: 'Memuat data siswa...' },
                    { progress: 60, text: 'Menyiapkan hafalan...' },
                    { progress: 80, text: 'Memuat riwayat...' },
                    { progress: 100, text: 'Siap! Mengalihkan...' }
                ];
                
                for (const step of steps) {
                    progressBar.style.width = step.progress + '%';
                    statusText.textContent = step.text;
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    resolve();
                }, 800);
            } catch (error) {
                console.error('Error in splash screen:', error);
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    resolve();
                }, 800);
            }
        });
    }

    // ==================== FUNGSI LOKASI ====================
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;

        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

        return R * c;
    }

    function isWithinSchoolRadius(lat, lng) {
        if (!lat || !lng) return false;
        const distance = calculateDistance(lat, lng, SCHOOL_LOCATION.lat, SCHOOL_LOCATION.lng);
        return distance <= SCHOOL_LOCATION.radius;
    }

    function getLocationStatus(lat, lng) {
        if (!lat || !lng) return { valid: false, text: 'Tidak diketahui', class: '', distance: null };
        const distance = calculateDistance(lat, lng, SCHOOL_LOCATION.lat, SCHOOL_LOCATION.lng);
        const withinRadius = distance <= SCHOOL_LOCATION.radius;
        return {
            valid: withinRadius,
            text: withinRadius ? `Dalam radius (${Math.round(distance)}m)` : `Luar radius (${Math.round(distance)}m)`,
            class: withinRadius ? 'location-valid' : 'location-invalid',
            distance: Math.round(distance)
        };
    }

    // ==================== FUNGSI CATATAN SISWA ====================
    async function loadStudentNotes() {
        try {
            const rows = await fetchSheetData('NOTES');
            
            if (rows && rows.length > 1) {
                const headers = rows[0];
                studentNotes = [];
                
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length === 0) continue;
                    
                    const note = {};
                    headers.forEach((header, index) => {
                        if (header && header.trim()) {
                            let value = row[index] || '';
                            if (header === 'created_at' || header === 'updated_at') {
                                note[header] = parseInt(value) || 0;
                            } else {
                                note[header] = value;
                            }
                        }
                    });
                    studentNotes.push(note);
                }
            }
        } catch (error) {
            console.error('Error loading notes:', error);
            studentNotes = [];
        }
    }

    function renderStudentNote() {
        const noteCard = document.getElementById('noteCard');
        const noteDate = document.getElementById('noteDate');
        const noteContent = document.querySelector('#noteContent p');
        
        if (!currentStudent) return;
        
        const note = studentNotes.find(n => n.student_id === currentStudent.id);
        
        if (note) {
            noteDate.textContent = note.updated_at ? 
                `Diperbarui: ${new Date(note.updated_at).toLocaleDateString('id-ID')}` : 
                '';
            noteContent.textContent = note.note;
            noteCard.classList.remove('hidden');
        } else {
            noteCard.classList.add('hidden');
        }
    }

    async function loadPelanggaran() {
        if (!currentStudent) return;
        
        document.getElementById('pelanggaranLoading')?.classList.remove('hidden');
        
        try {
            const rows = await fetchSheetData('PELANGGARAN');
            
            if (rows && rows.length > 1) {
                const headers = rows[0];
                pelanggaranRecords = [];
                
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length === 0) continue;
                    
                    const record = {};
                    headers.forEach((header, index) => {
                        if (header && header.trim()) {
                            let value = row[index] || '';
                            if (header === 'poin') {
                                record[header] = parseInt(value) || 0;
                            } else {
                                record[header] = value;
                            }
                        }
                    });
                    pelanggaranRecords.push(record);
                }
            }
            
            document.getElementById('pelanggaranLoading')?.classList.add('hidden');
            
            const siswaPelanggaran = pelanggaranRecords.filter(p => p.student_id === currentStudent.id);
            
            const totalPoin = siswaPelanggaran.reduce((sum, p) => sum + (p.poin || 0), 0);
            document.getElementById('totalPoin').textContent = totalPoin;
            
            renderPelanggaranList(siswaPelanggaran);
            
        } catch (error) {
            console.error('Error loading pelanggaran:', error);
            document.getElementById('pelanggaranLoading')?.classList.add('hidden');
        }
    }

    function renderPelanggaranList(pelanggaran) {
        const listEl = document.getElementById('pelanggaranList');
        const emptyEl = document.getElementById('pelanggaranEmpty');
        const summaryEl = document.getElementById('pelanggaranSummary');
        const totalPoinEl = document.getElementById('totalPoinPelanggaran');
        
        if (pelanggaran.length === 0) {
            listEl.innerHTML = '';
            emptyEl.classList.remove('hidden');
            summaryEl.classList.add('hidden');
            return;
        }
        
        emptyEl.classList.add('hidden');
        summaryEl.classList.remove('hidden');
        
        pelanggaran.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
        
        const totalPoin = pelanggaran.reduce((sum, p) => sum + (p.poin || 0), 0);
        totalPoinEl.textContent = totalPoin;
        
        listEl.innerHTML = pelanggaran.map(p => {
            let badgeClass = 'pelanggaran-ringan';
            if (p.poin >= 20) badgeClass = 'pelanggaran-berat';
            else if (p.poin >= 10) badgeClass = 'pelanggaran-sedang';
            
            const tanggal = new Date(p.tanggal).toLocaleDateString('id-ID', {
                day: 'numeric', month: 'long', year: 'numeric'
            });
            
            return `
                <div class="bg-gradient-to-r from-orange-50 to-red-50 rounded-2xl p-5 pelanggaran-item hover:shadow-lg transition">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-xs font-medium text-gray-500">${tanggal}</span>
                        <span class="pelanggaran-badge ${badgeClass} font-bold">${p.poin} Poin</span>
                    </div>
                    <div class="font-bold text-gray-800 mb-2 text-lg">${p.jenis}</div>
                    <div class="text-sm text-gray-600 mb-2">${p.kategori_nama || '-'}</div>
                    ${p.keterangan ? `<p class="text-xs text-gray-500 mt-2 p-3 bg-white/50 rounded-xl">📝 ${p.keterangan}</p>` : ''}
                </div>
            `;
        }).join('');
    }

    // ==================== FUNGSI LOAD DATA UTAMA ====================
    async function loadData() {
        try {
            const [studentsData, attendanceData] = await Promise.all([
                fetchSheetData('STUDENTS'),
                fetchSheetData('ATTENDANCE')
            ]);

            // Parse students
            if (studentsData && studentsData.length > 1) {
                const headers = studentsData[0];
                students = [];
                for (let i = 1; i < studentsData.length; i++) {
                    const row = studentsData[i];
                    if (row.length === 0) continue;
                    
                    const student = {};
                    headers.forEach((header, index) => {
                        if (header && header.trim()) {
                            student[header.trim()] = row[index] || '';
                        }
                    });
                    students.push(student);
                }
                console.log('✅ Loaded students:', students.length);
            }

            // Parse attendance
            if (attendanceData && attendanceData.length > 1) {
                const headers = attendanceData[0];
                attendanceRecords = [];
                
                for (let i = 1; i < attendanceData.length; i++) {
                    const row = attendanceData[i];
                    if (row.length === 0) continue;
                    
                    const record = {};
                    headers.forEach((header, index) => {
                        if (header && header.trim()) {
                            let value = row[index] || '';
                            
                            if (header === 'location_lat' || header === 'location_lng' || header === 'location_accuracy') {
                                record[header] = parseFloat(value) || 0;
                            } else if (header === 'timestamp') {
                                record[header] = parseInt(value) || 0;
                            } else {
                                record[header] = value;
                            }
                        }
                    });
                    
                    // Parse location
                    if (record.location_lat && record.location_lng) {
                        record.location = {
                            lat: record.location_lat,
                            lng: record.location_lng,
                            accuracy: record.location_accuracy || 0,
                            timestamp: record.timestamp || Date.now()
                        };
                        delete record.location_lat;
                        delete record.location_lng;
                        delete record.location_accuracy;
                    }
                    
                    attendanceRecords.push(record);
                }
                console.log('✅ Loaded attendance:', attendanceRecords.length);
            }

            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('id-ID');
            
            if (currentStudent) {
                loadAttendance();
                updateYearOptions();
                renderStudentNote();
            }
        } catch (error) {
            console.error('Error loading data:', error);
            showToast('Gagal memuat data', 'error');
        }
    }

    function updateYearOptions() {
        if (!currentStudent || !attendanceRecords.length) return;
        
        const studentAttendance = attendanceRecords.filter(r => r.student_id === currentStudent.id);
        
        const years = new Set();
        studentAttendance.forEach(record => {
            if (record.tanggal) {
                const year = record.tanggal.split('-')[0];
                if (year) years.add(year);
            }
        });
        
        const sortedYears = Array.from(years).sort((a, b) => b - a);
        
        const yearSelect = document.getElementById('yearFilter');
        const currentValue = yearSelect.value;
        
        let options = '<option value="">Semua Tahun</option>';
        sortedYears.forEach(year => {
            options += `<option value="${year}" ${year === currentValue ? 'selected' : ''}>${year}</option>`;
        });
        
        yearSelect.innerHTML = options;
    }

    function startAutoRefresh() {
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            loadData();
            if (currentStudent) loadPelanggaran();
        }, 30000);
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.innerHTML = `
            <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} text-xl"></i>
            <span>${message}</span>
        `;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function formatDate(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        return date.toLocaleDateString('id-ID', { 
            weekday: 'long', 
            day: 'numeric', 
            month: 'long', 
            year: 'numeric' 
        });
    }

    function formatTime(timestamp) {
        if (!timestamp) return '-';
        return new Date(parseInt(timestamp)).toLocaleTimeString('id-ID', {
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    async function handleLogin() {
        const nis = document.getElementById('loginNis').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (password !== "MASIBNUHUSAIN") {
            showToast('Password salah!', 'error');
            return;
        }

        await loadData();

        const student = students.find(s => s.nis === nis);
        if (!student) {
            showToast('NIS tidak ditemukan!', 'error');
            return;
        }

        currentStudent = student;
        document.getElementById('studentName').textContent = student.nama;
        document.getElementById('studentClass').textContent = `${student.kelas} - ${student.jurusan}`;
        document.getElementById('studentNis').textContent = `NIS: ${student.nis}`;
        document.getElementById('studentId').textContent = `ID: ${student.id || '-'}`;
        
        await loadStudentPhoto(student.photo);
        await loadStudentNotes();

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboardScreen').classList.remove('hidden');

        renderStudentNote();
        loadAttendance();
        
        // Load hafalan
        console.log('📚 Memuat hafalan untuk siswa:', student.nama, 'Kelas:', student.kelas);
        await loadHafalanProgress();
        
        await loadPelanggaran();
        updateYearOptions();
        startAutoRefresh();
        showToast(`Selamat datang, ${student.nama}`, 'success');
    }

    function loadAttendance() {
        const month = document.getElementById('monthFilter').value;
        const year = document.getElementById('yearFilter').value;
        
        let filtered = attendanceRecords.filter(r => r.student_id === currentStudent.id);
        
        if (month) {
            filtered = filtered.filter(r => r.tanggal && r.tanggal.split('-')[1] === month);
        }
        
        if (year) {
            filtered = filtered.filter(r => r.tanggal && r.tanggal.split('-')[0] === year);
        }

        filtered.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

        const stats = {
            hadir: filtered.filter(r => r.status === 'hadir').length,
            pulang: filtered.filter(r => r.status === 'pulang').length,
            izin: filtered.filter(r => r.status === 'izin').length,
            sakit: filtered.filter(r => r.status === 'sakit').length
        };

        const totalHadirPulang = stats.hadir + stats.pulang + stats.izin + stats.sakit;
        const persentase = totalHadirPulang > 0 ? ((stats.hadir / totalHadirPulang) * 100).toFixed(1) : 0;

        document.getElementById('statHadir').textContent = stats.hadir;
        document.getElementById('statPulang').textContent = stats.pulang;
        document.getElementById('statIzin').textContent = stats.izin;
        document.getElementById('statSakit').textContent = stats.sakit;
        document.getElementById('persentase').textContent = `${persentase}%`;
        document.getElementById('progressBar').style.width = `${persentase}%`;

        const list = document.getElementById('attendanceList');
        
        if (filtered.length === 0) {
            list.innerHTML = `
                <div class="text-center py-16">
                    <div class="text-6xl mb-4 text-gray-300">📅</div>
                    <p class="text-gray-500 font-medium">Belum ada data absensi</p>
                </div>
            `;
            return;
        }

        list.innerHTML = filtered.map(r => {
            const date = new Date(r.tanggal);
            const dayName = date.toLocaleDateString('id-ID', { weekday: 'long' });
            const formattedDate = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            
            const statusColors = {
                hadir: 'status-hadir',
                pulang: 'status-pulang',
                izin: 'status-izin',
                sakit: 'status-sakit',
                absen: 'status-absen'
            };

            const metodeIcon = {
                qr: 'fa-qrcode',
                manual: 'fa-pen'
            };

            const locationStatus = r.location ? getLocationStatus(r.location.lat, r.location.lng) : null;

            return `
                <div class="bg-white rounded-2xl p-5 hover:shadow-xl transition border border-gray-100">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <span class="text-base font-bold text-gray-800">${dayName}, ${formattedDate}</span>
                            <span class="text-xs text-gray-500 ml-3">
                                <i class="fas fa-clock mr-1"></i>${formatTime(r.timestamp)}
                            </span>
                        </div>
                        <span class="status-badge ${statusColors[r.status]}">
                            ${r.status === 'pulang' ? 'PULANG' : r.status.toUpperCase()}
                        </span>
                    </div>
                    
                    <div class="flex items-center gap-4 text-sm">
                        <span class="text-xs bg-gray-100 px-3 py-1.5 rounded-full font-medium">
                            <i class="fas ${metodeIcon[r.metode] || 'fa-question'} mr-1"></i>
                            ${r.metode || 'manual'}
                        </span>
                        
                        ${r.location ? `
                            <span class="location-badge ${locationStatus.class}">
                                <i class="fas fa-map-pin mr-1"></i>${locationStatus.text}
                            </span>
                        ` : ''}
                    </div>
                    
                    ${r.location ? `
                        <div class="location-info mt-3">
                            <div class="text-xs text-gray-600 flex items-center gap-2">
                                <i class="fas fa-crosshairs text-[#d4af37]"></i>
                                <span class="font-mono">${r.location.lat.toFixed(6)}, ${r.location.lng.toFixed(6)}</span>
                                <span class="bg-gray-200 px-2 py-1 rounded-full ml-auto">±${Math.round(r.location.accuracy)}m</span>
                            </div>
                        </div>
                    ` : ''}
                    
                    ${r.keterangan ? `<p class="text-xs text-gray-500 mt-3 p-3 bg-gray-50 rounded-xl">📝 ${r.keterangan}</p>` : ''}
                </div>
            `;
        }).join('');
    }

    function logout() {
        if (refreshInterval) {
            clearInterval(refreshInterval);
            refreshInterval = null;
        }
        currentStudent = null;
        surahNames = [];
        pelanggaranRecords = [];
        document.getElementById('dashboardScreen').classList.add('hidden');
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('loginNis').value = '';
        document.getElementById('loginPassword').value = '';
        
        document.getElementById('studentPhoto').classList.add('hidden');
        document.getElementById('studentPhotoFallback').classList.remove('hidden');
        document.getElementById('studentPhotoLoading').classList.add('hidden');
    }

    async function init() {
        try {
            await initSplashScreen();
        } catch (error) {
            console.error('Error in init:', error);
            document.getElementById('splashScreen').style.display = 'none';
        }
    }

    window.onload = init;
    window.testGoogleSheet = testGoogleSheet;
    window.retryLoadHafalan = retryLoadHafalan;
    window.handleLogin = handleLogin;
    window.loadAttendance = loadAttendance;
    window.logout = logout;
    window.handleImageError = handleImageError;
  </script>
