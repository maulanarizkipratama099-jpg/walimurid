    // ==================== FUNGSI LOKASI ====================
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;

        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

        return R * c;
    }

    function isWithinSchoolRadius(lat, lng) {
        if (!lat || !lng) return false;
        const distance = calculateDistance(lat, lng, SCHOOL_LOCATION.lat, SCHOOL_LOCATION.lng);
        return distance <= SCHOOL_LOCATION.radius;
    }

    function getLocationStatus(lat, lng) {
        if (!lat || !lng) return { valid: false, text: 'Tidak diketahui', class: '', distance: null };
        const distance = calculateDistance(lat, lng, SCHOOL_LOCATION.lat, SCHOOL_LOCATION.lng);
        const withinRadius = distance <= SCHOOL_LOCATION.radius;
        return {
            valid: withinRadius,
            text: withinRadius ? `Dalam radius (${Math.round(distance)}m)` : `Luar radius (${Math.round(distance)}m)`,
            class: withinRadius ? 'location-valid' : 'location-invalid',
            distance: Math.round(distance)
        };
    }

    // ==================== FUNGSI GOOGLE SHEETS ====================
    async function fetchSheetData(sheetId, sheetName, range) {
        try {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${sheetName}!${range}?key=${GOOGLE_API_KEY}`;
            const response = await fetch(url);
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data.values || [];
        } catch (error) {
            console.error(`Error fetching sheet ${sheetId} - ${sheetName}:`, error);
            throw error;
        }
    }

    async function getSurahNames(sheetId, sheetName) {
        try {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${sheetName}!A5:AQ5?key=${GOOGLE_API_KEY}`;
            const response = await fetch(url);
            if (!response.ok) return [];
            const data = await response.json();
            const row = data.values?.[0] || [];
            return row.slice(COLUMN_INDEX.QURAN.START_SURAH, COLUMN_INDEX.QURAN.START_SURAH + TARGETS.QURAN);
        } catch (error) {
            console.error('Error fetching surah names:', error);
            return [];
        }
    }

    function getSheetNameByClass(kelas) {
        if (!kelas) return SHEET_NAMES.X;
        const kelasUpper = kelas.toUpperCase().trim();
        if (kelasUpper.startsWith('XII')) return SHEET_NAMES.XII;
        if (kelasUpper.startsWith('XI')) return SHEET_NAMES.XI;
        if (kelasUpper.startsWith('X')) return SHEET_NAMES.X;
        return SHEET_NAMES.X;
    }

    function processQuranData(row) {
        const totalHafal = parseInt(row[COLUMN_INDEX.QURAN.TOTAL_HAFALAN]) || 0;
        
        const hafal = [];
        const belum = [];
        
        for (let i = 1; i <= TARGETS.QURAN; i++) {
            const colIndex = COLUMN_INDEX.QURAN.START_SURAH + (i - 1);
            const status = row[colIndex]?.toString().toLowerCase() || '';
            const isHafal = status === '☑' || status === 'true' || status === '1' || status === 'yes';
            
            if (isHafal) hafal.push(i);
            else belum.push(i);
        }
        
        const progress = (totalHafal / TARGETS.QURAN) * 100;
        const lastSurahNum = hafal.length > 0 ? Math.max(...hafal) : 0;
        const lastSurahName = (lastSurahNum > 0 && surahNames[lastSurahNum - 1]) 
            ? `${lastSurahNum}. ${surahNames[lastSurahNum - 1]}`
            : '-';
        
        document.getElementById('quranLastSurah').textContent = lastSurahName;
        document.getElementById('quranTotalHafal').textContent = `${totalHafal} Surat`;
        document.getElementById('quranProgressPercent').textContent = `${progress.toFixed(1)}%`;
        document.getElementById('quranProgressBar').style.width = `${progress}%`;
        document.getElementById('quranStats').textContent = `${totalHafal}/${TARGETS.QURAN} Surat`;
        document.getElementById('quranHafalCount').textContent = hafal.length;
        document.getElementById('quranBelumCount').textContent = belum.length;
        
        const hafalList = document.getElementById('quranHafalList');
        hafalList.innerHTML = hafal.map(num => `
            <div class="surah-item hafal">
                <div class="surah-number hafal">${num}</div>
                <span class="surah-name">${surahNames[num - 1] || `Surat ${num}`}</span>
                <i class="fas fa-check-circle text-green-500 text-xs ml-2"></i>
            </div>
        `).join('');
        
        const belumList = document.getElementById('quranBelumList');
        belumList.innerHTML = belum.map(num => `
            <div class="surah-item belum">
                <div class="surah-number belum">${num}</div>
                <span class="surah-name">${surahNames[num - 1] || `Surat ${num}`}</span>
                <i class="fas fa-hourglass-half text-red-400 text-xs ml-2"></i>
            </div>
        `).join('');
    }

    async function loadHafalanProgress() {
        document.getElementById('hafalanLoading').classList.remove('hidden');
        document.getElementById('hafalanError').classList.add('hidden');
        document.getElementById('hafalanContent').classList.add('hidden');

        if (!currentStudent) {
            document.getElementById('hafalanLoading').classList.add('hidden');
            document.getElementById('hafalanErrorMessage').textContent = 'Siswa tidak ditemukan';
            document.getElementById('hafalanError').classList.remove('hidden');
            return;
        }

        try {
            const kelasSheet = getSheetNameByClass(currentStudent.kelas);
            
            if (surahNames.length === 0) {
                surahNames = await getSurahNames(SHEET_IDS.QURAN, kelasSheet);
            }
            
            let quranData = [];
            try {
                quranData = await fetchSheetData(SHEET_IDS.QURAN, kelasSheet, "A6:AQ");
            } catch (error) {}
            
            let hadistData = [];
            try {
                hadistData = await fetchSheetData(SHEET_IDS.HADIST, kelasSheet, "A6:AQ");
            } catch (error) {}

            document.getElementById('hafalanLoading').classList.add('hidden');

            if (quranData && quranData.length > 0) {
                const studentRow = quranData.find(row => {
                    const rowNis = row[COLUMN_INDEX.QURAN.NIS]?.toString().trim();
                    return rowNis === currentStudent.nis.toString().trim();
                });
                
                if (studentRow) processQuranData(studentRow);
                else resetQuranData();
            } else resetQuranData();

            if (hadistData && hadistData.length > 0) {
                const studentRow = hadistData.find(row => {
                    const rowNis = row[COLUMN_INDEX.HADIST.NIS]?.toString().trim();
                    return rowNis === currentStudent.nis.toString().trim();
                });
                
                if (studentRow) processHadistData(studentRow);
                else resetHadistData();
            } else resetHadistData();

            document.getElementById('hafalanContent').classList.remove('hidden');

        } catch (error) {
            console.error('Error:', error);
            document.getElementById('hafalanLoading').classList.add('hidden');
            document.getElementById('hafalanErrorMessage').textContent = error.message;
            document.getElementById('hafalanError').classList.remove('hidden');
        }
    }

    function retryLoadHafalan() {
        loadHafalanProgress();
    }

    // ==================== FUNGSI PELANGGARAN ====================
    async function loadPelanggaran() {
        if (!currentStudent) return;
        
        document.getElementById('pelanggaranLoading')?.classList.remove('hidden');
        
        try {
            const response = await fetch(`${JSONBIN_CONFIG.BASE_URL}/${JSONBIN_CONFIG.BINS.PELANGGARAN}/latest`, {
                headers: { 'X-Master-Key': JSONBIN_CONFIG.API_KEY, 'X-Bin-Meta': 'false' }
            });
            
            if (response.ok) {
                const data = await response.json();
                if (data.pelanggaran) {
                    pelanggaranRecords = Array.isArray(data.pelanggaran) ? data.pelanggaran : [];
                } else {
                    pelanggaranRecords = Array.isArray(data) ? data : [];
                }
            } else {
                pelanggaranRecords = [];
            }
            
            document.getElementById('pelanggaranLoading')?.classList.add('hidden');
            
            const siswaPelanggaran = pelanggaranRecords.filter(p => p.student_id === currentStudent.id);
            
            const totalPoin = siswaPelanggaran.reduce((sum, p) => sum + (p.poin || 0), 0);
            document.getElementById('totalPoin').textContent = totalPoin;
            
            renderPelanggaranList(siswaPelanggaran);
            
        } catch (error) {
            console.error('Error loading pelanggaran:', error);
            document.getElementById('pelanggaranLoading')?.classList.add('hidden');
        }
    }

    function renderPelanggaranList(pelanggaran) {
        const listEl = document.getElementById('pelanggaranList');
        const emptyEl = document.getElementById('pelanggaranEmpty');
        const summaryEl = document.getElementById('pelanggaranSummary');
        const totalPoinEl = document.getElementById('totalPoinPelanggaran');
        
        if (pelanggaran.length === 0) {
            listEl.innerHTML = '';
            emptyEl.classList.remove('hidden');
            summaryEl.classList.add('hidden');
            return;
        }
        
        emptyEl.classList.add('hidden');
        summaryEl.classList.remove('hidden');
        
        pelanggaran.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
        
        const totalPoin = pelanggaran.reduce((sum, p) => sum + (p.poin || 0), 0);
        totalPoinEl.textContent = totalPoin;
        
        listEl.innerHTML = pelanggaran.map(p => {
            let badgeClass = 'pelanggaran-ringan';
            if (p.poin >= 20) badgeClass = 'pelanggaran-berat';
            else if (p.poin >= 10) badgeClass = 'pelanggaran-sedang';
            
            const tanggal = new Date(p.tanggal).toLocaleDateString('id-ID', {
                day: 'numeric', month: 'long', year: 'numeric'
            });
            
            return `
                <div class="bg-orange-50 rounded-xl p-4 pelanggaran-item">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs text-gray-500">${tanggal}</span>
                        <span class="pelanggaran-badge ${badgeClass} font-bold">${p.poin} Poin</span>
                    </div>
                    <div class="font-semibold text-gray-800 mb-1">${p.jenis}</div>
                    <div class="text-xs text-gray-600">${p.kategori_nama || '-'}</div>
                    ${p.keterangan ? `<p class="text-xs text-gray-500 mt-2">${p.keterangan}</p>` : ''}
                </div>
            `;
        }).join('');
    }

    async function loadData() {
        try {
            const [studentsRes, attendanceRes] = await Promise.all([
                fetch(`${JSONBIN_CONFIG.BASE_URL}/${JSONBIN_CONFIG.BINS.STUDENTS}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_CONFIG.API_KEY, 'X-Bin-Meta': 'false' }
                }),
                fetch(`${JSONBIN_CONFIG.BASE_URL}/${JSONBIN_CONFIG.BINS.ATTENDANCE}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_CONFIG.API_KEY, 'X-Bin-Meta': 'false' }
                })
            ]);

            students = await studentsRes.json();
            attendanceRecords = await attendanceRes.json();

            if (!Array.isArray(students)) students = [];
            if (!Array.isArray(attendanceRecords)) attendanceRecords = [];

            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('id-ID');
            
            if (currentStudent) {
                loadAttendance();
                updateYearOptions();
            }
        } catch (error) {
            console.error('Error loading data:', error);
            showToast('Gagal memuat data', 'error');
        }
    }

    function updateYearOptions() {
        if (!currentStudent || !attendanceRecords.length) return;
        
        const studentAttendance = attendanceRecords.filter(r => r.student_id === currentStudent.id);
        
        const years = new Set();
        studentAttendance.forEach(record => {
            if (record.tanggal) {
                const year = record.tanggal.split('-')[0];
                if (year) years.add(year);
            }
        });
        
        const sortedYears = Array.from(years).sort((a, b) => b - a);
        
        const yearSelect = document.getElementById('yearFilter');
        const currentValue = yearSelect.value;
        
        let options = '<option value="">Semua Tahun</option>';
        sortedYears.forEach(year => {
            options += `<option value="${year}" ${year === currentValue ? 'selected' : ''}>${year}</option>`;
        });
        
        yearSelect.innerHTML = options;
    }

    function startAutoRefresh() {
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            loadData();
            if (currentStudent) loadPelanggaran();
        }, 30000);
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast toast-${type} flex items-center gap-3`;
        toast.innerHTML = `
            <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} text-lg"></i>
            <span>${message}</span>
        `;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function formatDate(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        return date.toLocaleDateString('id-ID', { 
            weekday: 'long', 
            day: 'numeric', 
            month: 'long', 
            year: 'numeric' 
        });
    }

    function formatTime(timestamp) {
        if (!timestamp) return '-';
        return new Date(timestamp).toLocaleTimeString('id-ID', {
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    async function handleLogin() {
        const nis = document.getElementById('loginNis').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (password !== "MASIBNUHUSAIN") {
            showToast('Password salah!', 'error');
            return;
        }

        await loadData();

        const student = students.find(s => s.nis === nis);
        if (!student) {
            showToast('NIS tidak ditemukan!', 'error');
            return;
        }

        currentStudent = student;
        document.getElementById('studentName').textContent = student.nama;
        document.getElementById('studentClass').textContent = `${student.kelas} - ${student.jurusan}`;
        document.getElementById('studentNis').textContent = `NIS: ${student.nis}`;
        
        const photoEl = document.getElementById('studentPhoto');
        const iconEl = document.getElementById('studentPhotoIcon');
        
        if (student.photo) {
            photoEl.src = student.photo;
            photoEl.classList.remove('hidden');
            iconEl.classList.add('hidden');
        } else {
            photoEl.classList.add('hidden');
            iconEl.classList.remove('hidden');
        }

        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');

        loadAttendance();
        await loadHafalanProgress();
        await loadPelanggaran();
        updateYearOptions();
        startAutoRefresh();
        showToast(`Selamat datang, ${student.nama}`, 'success');
    }

    // FUNGSI UTAMA: loadAttendance dengan Map
    function loadAttendance() {
        const month = document.getElementById('monthFilter').value;
        const year = document.getElementById('yearFilter').value;
        
        let filtered = attendanceRecords.filter(r => r.student_id === currentStudent.id);
        
        if (month) {
            filtered = filtered.filter(r => r.tanggal.split('-')[1] === month);
        }
        
        if (year) {
            filtered = filtered.filter(r => r.tanggal.split('-')[0] === year);
        }

        filtered.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

        // Hitung statistik dengan memisahkan masuk dan pulang
        const stats = {
            hadir: filtered.filter(r => r.status === 'hadir' && r.type === 'masuk').length,
            pulang: filtered.filter(r => r.status === 'hadir' && r.type === 'pulang').length,
            izin: filtered.filter(r => r.status === 'izin').length,
            sakit: filtered.filter(r => r.status === 'sakit').length
        };

        const total = filtered.length;
        const persentase = total > 0 ? ((stats.hadir / total) * 100).toFixed(1) : 0;

        document.getElementById('statHadir').textContent = stats.hadir;
        document.getElementById('statIzin').textContent = stats.izin;
        document.getElementById('statSakit').textContent = stats.sakit;
        document.getElementById('persentase').textContent = `${persentase}%`;
        document.getElementById('progressBar').style.width = `${persentase}%`;

        const list = document.getElementById('attendanceList');
        
        if (filtered.length === 0) {
            list.innerHTML = `
                <div class="text-center py-12">
                    <div class="text-5xl mb-4 text-gray-300">📅</div>
                    <p class="text-gray-500">Belum ada data absensi</p>
                </div>
            `;
            return;
        }

        list.innerHTML = filtered.map(r => {
            const date = new Date(r.tanggal);
            const dayName = date.toLocaleDateString('id-ID', { weekday: 'long' });
            const formattedDate = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            
            const statusColors = {
                hadir: 'status-hadir',
                izin: 'status-izin',
                sakit: 'status-sakit',
                absen: 'status-absen'
            };

            const metodeIcon = {
                qr: 'fa-qrcode',
                manual: 'fa-pen'
            };

            const locationStatus = r.location ? getLocationStatus(r.location.lat, r.location.lng) : null;
            const typeClass = r.type === 'pulang' ? 'attendance-type pulang' : 'attendance-type masuk';
            const typeText = r.type === 'pulang' ? 'PULANG' : 'HADIR';
            
            const mapThumbnail = r.location ? 
                `https://maps.googleapis.com/maps/api/staticmap?center=${r.location.lat},${r.location.lng}&zoom=16&size=80x60&maptype=roadmap&markers=color:red%7C${r.location.lat},${r.location.lng}&key=AIzaSyDTKZRcAp-b7p0js0obNooW83DLFRXNl18` : 
                null;

            return `
                <div class="bg-gray-50 rounded-xl p-4 hover:bg-gray-100 transition attendance-card" 
                     onclick='openMapModal(${r.location?.lat || 0}, ${r.location?.lng || 0}, 
                        "Lokasi Absensi ${r.student_nama}", 
                        "<b>${r.student_nama}</b><br>${dayName}, ${formattedDate}<br>${typeText} - ${r.status.toUpperCase()}<br>${locationStatus?.text || "Tidak ada lokasi"}<br>Waktu: ${formatTime(r.timestamp)}")'>
                    
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <span class="text-sm font-medium text-gray-800">${dayName}, ${formattedDate}</span>
                            <span class="text-xs text-gray-500 ml-2">
                                <i class="fas fa-clock mr-1"></i>${formatTime(r.timestamp)}
                            </span>
                        </div>
                        <div class="flex gap-2">
                            <span class="${typeClass}">${typeText}</span>
                            <span class="status-badge ${statusColors[r.status]}">
                                ${r.status.toUpperCase()}
                            </span>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3 text-sm">
                        <span class="text-xs text-gray-500">
                            <i class="fas ${metodeIcon[r.metode] || 'fa-question'} mr-1"></i>
                            ${r.metode || 'manual'}
                        </span>
                        
                        ${r.location ? `
                            <span class="location-badge ${locationStatus.class}">
                                <i class="fas fa-map-pin mr-1"></i>${locationStatus.text}
                            </span>
                        ` : ''}
                    </div>
                    
                    ${r.location ? `
                        <div class="flex items-center gap-3 mt-3">
                            <img src="${mapThumbnail}" 
                                 class="map-thumbnail" 
                                 onclick="event.stopPropagation(); openMapModal(${r.location.lat}, ${r.location.lng}, 
                                    'Lokasi Absensi ${r.student_nama}', 
                                    '<b>${r.student_nama}</b><br>${dayName}, ${formattedDate}<br>${typeText} - ${r.status.toUpperCase()}<br>${locationStatus.text}<br>Koordinat: ${r.location.lat.toFixed(6)}, ${r.location.lng.toFixed(6)}<br>Akurasi: ±${Math.round(r.location.accuracy)}m')"
                                 title="Klik untuk lihat peta">
                            
                            <div class="flex-1 text-xs text-gray-600">
                                <i class="fas fa-crosshairs mr-1"></i>
                                ${r.location.lat.toFixed(6)}, ${r.location.lng.toFixed(6)}
                                <span class="text-gray-400 block mt-1">Akurasi: ±${Math.round(r.location.accuracy)}m</span>
                            </div>
                        </div>
                    ` : ''}
                    
                    ${r.keterangan ? `<p class="text-xs text-gray-500 mt-2 border-t pt-2">📝 ${r.keterangan}</p>` : ''}
                </div>
            `;
        }).join('');
    }

    function logout() {
        if (refreshInterval) {
            clearInterval(refreshInterval);
            refreshInterval = null;
        }
        currentStudent = null;
        surahNames = [];
        pelanggaranRecords = [];
        document.getElementById('dashboardScreen').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('loginNis').value = '';
        document.getElementById('loginPassword').value = '';
    }
  </script>
</body>
